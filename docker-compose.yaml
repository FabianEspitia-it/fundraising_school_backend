services:
  webdriver:
    image: selenium/standalone-chrome:latest
    restart: always
    privileged: true
    shm_size: 2g
    hostname: chrome
    ports:
      - "7900:7900"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4444 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgresql://root:M#Build#M@fundraising-school-db-development.c942ssuu8bfm.us-east-2.rds.amazonaws.com:5432/fundraising_school_db
      - PORT=8080
      - LINKEDIN_USER=pirajulian568@gmail.com
      - LINKEDIN_PASSWORD=Josepira1*
      - WEBDRIVER_URL=http://chrome:4444/wd/hub
    depends_on:
      webdriver:
        condition: service_healthy
